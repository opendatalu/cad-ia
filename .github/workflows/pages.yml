name: Recherche plein texte (GitHub Pages)

on:
  # Régénération quotidienne pour intégrer les nouveaux avis publiés par la CAD
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas un déploiement en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # OCR des PDF scannés (sans couche texte) lors de la conversion
      - name: Installation de Tesseract (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra poppler-utils

      - name: Récupération de la liste des avis
        run: npm run fetch

      # Les PDF ne changent pas une fois publiés : on les garde en cache
      # entre deux exécutions pour ne télécharger que les nouveaux.
      - name: Cache des PDF
        uses: actions/cache@v4
        with:
          path: data/pdfs
          key: pdfs-${{ hashFiles('data/avis.json') }}
          restore-keys: pdfs-

      - name: Téléchargement des PDF
        run: npm run download

      # L'OCR n'est fait qu'une fois par PDF scanné : les résultats sont gardés en cache
      - name: Cache de l'OCR
        uses: actions/cache@v4
        with:
          path: data/ocr
          key: ocr-${{ hashFiles('data/avis.json') }}
          restore-keys: ocr-

      - name: Conversion en Markdown / HTML (avec OCR des PDF scannés)
        run: npm run convert

      - name: Génération de la page de recherche et de l'index Pagefind
        run: npm run search

      # On ne publie que le site (page de recherche, pages des avis, index).
      # Les PDF et le Markdown restent hors du site : les pages renvoient
      # vers les PDF originaux sur cad.gouvernement.lu.
      - name: Préparation du site
        run: |
          mkdir -p _site
          cp -r data/index.html data/html data/pagefind _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
