name: Full-text search (GitHub Pages)

on:
  # Rebuild twice a month (1st and 15th, 05:00 UTC) to include the new avis published by the CAD
  schedule:
    - cron: '0 5 1,15 * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a deployment in progress is not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # OCR of scanned PDFs (without text layer) during conversion
      - name: Install Tesseract (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra poppler-utils

      - name: Fetch the list of avis
        run: npm run fetch

      # PDFs don't change once published: they are cached between
      # runs so that only new ones are downloaded.
      - name: Cache PDFs
        uses: actions/cache@v4
        with:
          path: data/pdfs
          key: pdfs-${{ hashFiles('data/avis.json') }}
          restore-keys: pdfs-

      - name: Download PDFs
        run: npm run download

      # OCR is only run once per scanned PDF: the results are cached
      - name: Cache OCR results
        uses: actions/cache@v4
        with:
          path: data/ocr
          key: ocr-${{ hashFiles('data/avis.json') }}
          restore-keys: ocr-

      - name: Convert to Markdown / HTML (with OCR of scanned PDFs)
        run: npm run convert

      - name: Generate the search page and the Pagefind index
        run: npm run search

      # Only the site is published (search page, avis pages, index, corpus archive).
      # PDFs and Markdown stay out of the site: the pages link
      # to the original PDFs on cad.gouvernement.lu.
      - name: Prepare the site
        run: |
          mkdir -p _site
          cp -r data/index.html data/html data/pagefind data/corpus.zip _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
